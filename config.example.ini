# Copier dans ~/.config/kitot/config.ini et adapter.
# Les clés absentes reprennent leur valeur par défaut au lancement.
[caldav]
# URL CalDAV « home » du compte : les agendas sont découverts automatiquement.
url = https://caldav.exemple.fr/dav/home/prenom.nom@exemple.fr/
# Identifiant de connexion (selon le serveur : uid ou adresse mail).
user = pnom
# Noms d'agendas à surveiller, séparés par des virgules (vide = tous).
calendars =

# Cascade de rappels, en minutes avant le rdv (0 = à l'heure du rdv).
before_minutes = 30,5,0
critical_last = true
sound_last = true
sound_reminders = true
use_calendar_alarms = true
snooze_minutes = 5

# Récapitulatifs (0 = désactivé).
digest_hour = 8
eve_digest_hour = 17
notify_changes = true

interval_seconds = 300
window_hours = 48
allday_hour = 8
